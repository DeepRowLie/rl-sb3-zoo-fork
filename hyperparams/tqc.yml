## template
re-train: &RE
  learning_starts: !!float 5e5
  learning_rate: linear_7.3e-5

per-config: &PER
  callback:
    - utils.callbacks.LapTimeCallback
  replay_buffer_class: PrioritizedReplayBuffer
  buffer_size: !!int 1048576
  batch_size: 512
  learning_starts: 1500
  train_freq: [1, "episode"]
  gradient_steps: 200

Env-config: &defaults
  # Normalize AE (+ the rest)
  normalize: "{'norm_obs': True, 'norm_reward': False}"
  env_wrapper:
    - gym.wrappers.time_limit.TimeLimit:
        max_episode_steps: 10000
    - ae.wrapper.AutoencoderWrapper:
        ae_path: "/home/hero/Projects/DRL/donkeycar/scratch/aae-train-donkeycar/ae/logs/mountain-track/ae-32_1709022771_best.pkl"
    - utils.wrappers.HistoryWrapper:
        horizon: 2
  callback:
    - utils.callbacks.ParallelTrainCallback:
        gradient_steps: 200
    - utils.callbacks.LapTimeCallback
  n_timesteps: !!float 2e6
  #  policy: 'CnnPolicy'
  policy: 'MlpPolicy'
  learning_rate: !!float 7.3e-4
  #  learning_rate: !!float 3e-4
  buffer_size: 200000
  batch_size: 256
  ent_coef: 'auto'
  gamma: 0.99
  tau: 0.02
  train_freq: 200
  gradient_steps: 200
  #  gradient_steps: -1
  learning_starts: 500
  use_sde_at_warmup: True
  use_sde: True
  sde_sample_freq: 16
  policy_kwargs: "dict(log_std_init=-3, net_arch=[256, 256], n_critics=2, use_expln=True)"

## Custom envs
donkey-mountain-track-v0:
  <<: *defaults
  <<: *PER

donkey-avc-sparkfun-v0:
  <<: *defaults
  <<: *PER
  env_wrapper:
    - gym.wrappers.time_limit.TimeLimit:
        max_episode_steps: 10000
    - dalle_pytorch.wrapper.AutoencoderWrapper:
        ae_path: "/home/hero/Projects/github/site-pkgs/DALLE-pytorch/vae.pt"
    - utils.wrappers.HistoryWrapper:
        horizon: 2
  n_timesteps: !!float 5e6
  buffer_size: !!int 2097152
  policy_kwargs: "dict(log_std_init=-3, net_arch=[1024, 512, 256, 256], n_critics=2, use_expln=True)"
  # if retrain the pretrained model, otherwise comment the following line
#  <<: *RE
